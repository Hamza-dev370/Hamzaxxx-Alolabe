<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Hamza</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            background:
                radial-gradient(circle at 50% -10%, #ddd0f5 10%, #eee8fa 40%, #f8f6fc 50%, #ffffff 60%),
                radial-gradient(circle at 80% 100%, #d9f7e9 40%, #eafaf3 50%, #ffffff 80%);
            background-blend-mode: multiply;
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
        }

        /* ===== Hero ===== */
        .hero {
            background: #3248DE;
            min-height: 440px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .hero:after {
            content: "";
            position: absolute;
            width: 330px;
            height: 330px;
            left: -170px;
            top: -80px;
            background: rgba(255, 255, 255, .06);
            border-radius: 50%;
        }

        .hero h1 {
            font-size: clamp(45px, 9vw, 78px);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 25px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        .subtitle {
            font-size: clamp(16px, 3vw, 22px);
            color: #c7d0ff;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 760px;
            margin: auto;
            font-size: clamp(19px, 3.6vw, 28px);
            line-height: 2;
            color: #eeeaff;
            font-family: "Cairo", sans-serif;
        }

        .hero-btn {
            display: inline-flex;
            margin-top: 35px;
            padding: 14px 35px;
            border-radius: 40px;
            color: #fff;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .3);
            text-decoration: none;
            font-size: 20px;
            transition: .25s;
        }

        .hero-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, .22);
        }

        /* ===== Cards ===== */
        .mah {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 40px 20px;
            background: #f1f5f9;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hh2 {
            grid-column: 1 / -1;
            text-align: center;
            color: #555;
            font-family: "Cairo", sans-serif;
            margin-bottom: 20px;
            font-size: clamp(24px, 5vw, 32px);
        }

        .item {
            padding: 40px 20px;
            border-radius: 12px;
            color: #fff;
            text-align: center;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            transition: transform 0.3s;
        }

        .item:hover {
            transform: translateY(-5px);
        }

        .item p {
            margin: 0;
            font-family: "Cairo", sans-serif;
        }

        .mah i {
            color: skyblue;
            margin-right: 8px;
        }

        /* ===== Responsive: لابتوب عمودان ===== */
        @media (min-width: 768px) {
            .mah {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <header class="hero">
        <div class="container">
            <h1>Dev Hamza</h1>
            <div class="subtitle">للمواقع الخدمية</div>
            <p>
                انشئ موقعك الإلكتروني للوصول لأكبر عدد من العملاء من خلال إيصال و نشر عملك على الانترنت
            </p>
            <a class="hero-btn" href="#mah">اكتشف المميزات ↓</a>
        </div>
    </header>

    <div class="mah" id="mah">
        <h2 class="hh2">خدماتنا التقنية</h2>

        <div class="item" style="background: #1A27BB;">
            <p>صفحات شخصية <i class="fa-solid fa-user"></i></p>
        </div>

        <div class="item" style="background: #1ABB4C;">
            <p>صفحات للشركات <i class="fa-solid fa-building"></i></p>
        </div>

        <div class="item" style="background: #BB1A1A;">
            <p>صفحات هبوط <i class="fa-solid fa-rocket"></i></p>
        </div>

        <div class="item" style="background: #BBA61A;">
            <p>مواقع للمحلات التجارية <i class="fa-solid fa-cart-shopping"></i></p>
        </div>
    </div>

</body>

</html>
